[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-terminal"
version = "0.1.0"
description = "Terminal tools for USB-to-UART adapters: curses TUI, plain RX/TX terminal, and read-only monitor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "windows-curses; sys_platform == 'win32'",
]

[project.scripts]
serial-terminal = "serial_terminal:main"
serial-tui = "serial_tui:main"
serial-reader = "serial_reader:main"

[tool.setuptools]
py-modules = ["serial_common", "serial_terminal", "serial_tui", "serial_reader"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "PL", "RUF"]
ignore = [
    "PLR0912", "PLR0915", "PLR2004",  # long TUI loop / magic key codes are fine here
    "S603", "S606", "S607",            # tests spawn the tools via subprocess/execv on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
